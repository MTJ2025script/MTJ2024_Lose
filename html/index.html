<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTJ Los</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- OVERLAY (versteckt bis Item benutzt wird) -->
<div id="app">

    <!-- ══════════════════════════════════
         TICKET-SCREEN
         ══════════════════════════════════ -->
    <div id="screen-ticket">
        <div id="ticket-card">
            <div id="ticket-bg-img"></div>
            <div id="ticket-inner">

                <div id="ticket-header">
                    <span id="ticket-logo-mark">🎟 MTJ LOS</span>
                    <span id="ticket-name-label"></span>
                </div>

                <div id="scratch-zone">
                    <!-- Dekoratives Muster liegt UNTER dem Canvas -->
                    <div id="scratch-under">
                        <div class="scratch-stars">✦ ✦ ✦ ✦ ✦</div>
                        <div class="scratch-cta-text">Hier Rubbeln!</div>
                        <div class="scratch-stars">✦ ✦ ✦ ✦ ✦</div>
                    </div>
                    <!-- Rubbelschicht -->
                    <canvas id="scratch-canvas"></canvas>
                </div>

                <div id="ticket-hint">🖱 Klicken &amp; Ziehen zum Aufrubbeln</div>

                <div id="ticket-footer-row">
                    <span id="ticket-footer-text">Viel Glück! • MTJ Server</span>
                    <button id="btn-close-ticket" onclick="closeUI()">✖</button>
                </div>

            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════
         WIN-SCREEN
         ══════════════════════════════════ -->
    <div id="screen-win">
        <div id="confetti-root"></div>

        <div id="win-panel">
            <div id="win-glow"></div>

            <div id="prize-visual">
                <img id="prize-img" src="" alt="" />
                <span id="prize-icon-fallback">🏆</span>
            </div>

            <div id="win-badge">🎉 GLÜCKWUNSCH! 🎉</div>
            <div id="win-prize-label"></div>

            <button id="btn-collect" onclick="collectPrize()">✅ Einsammeln</button>
        </div>
    </div>

    <!-- ══════════════════════════════════
         LOSE-SCREEN
         ══════════════════════════════════ -->
    <div id="screen-lose">
        <div id="lose-panel">
            <div id="lose-emoji">😔</div>
            <div id="lose-headline">Leider nichts gewonnen</div>
            <div id="lose-subtext"></div>
            <button id="btn-lose-ok" onclick="closeUI()">OK, nächstes Mal!</button>
        </div>
    </div>

</div>

<script src="js/main.js"></script>
</body>
</html>
